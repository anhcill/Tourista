<!DOCTYPE html>
<html>
<head>
    <title>Test Booking Lookup</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 10px 0; padding: 10px; background: #2a2a2a; border-radius: 5px; }
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
        .info { border-left: 4px solid #2196f3; }
        pre { background: #333; padding: 10px; overflow-x: auto; border-radius: 3px; }
        h2 { color: #4caf50; }
    </style>
</head>
<body>
    <h2>🔍 Booking Lookup Test</h2>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(text, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<pre>${typeof text === 'object' ? JSON.stringify(text, null, 2) : text}</pre>`;
            results.appendChild(div);
        }

        async function runTests() {
            const token = localStorage.getItem('accessToken') || sessionStorage.getItem('accessToken');
            const userData = localStorage.getItem('user') || sessionStorage.getItem('user');

            log("=== Token & User Info ===", 'info');
            log({
                "Token exists": !!token,
                "Token (first 50)": token ? token.substring(0, 50) + "..." : "NONE",
                "User": userData ? JSON.parse(userData) : "NONE"
            });

            if (!token) {
                log("❌ Không có token - chưa đăng nhập hoặc token đã hết hạn!", 'error');
                return;
            }

            // Test 1: Railway backend direct
            log("\n--- Test 1: Railway backend direct ---", 'info');
            try {
                const res = await fetch("https://tourista-production.up.railway.app/api/chat/booking?code=TRS-20260506-50188", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                log({ status: res.status, response: data }, res.ok ? 'success' : 'error');
            } catch (e) {
                log({ error: e.message }, 'error');
            }

            // Test 2: Via Vercel proxy
            log("\n--- Test 2: Via Vercel proxy (/api/) ---", 'info');
            try {
                const res = await fetch("/api/chat/booking?code=TRS-20260506-50188", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                log({ status: res.status, response: data }, res.ok ? 'success' : 'error');
            } catch (e) {
                log({ error: e.message }, 'error');
            }

            // Test 3: Chat message
            log("\n--- Test 3: /api/chat/message ---", 'info');
            try {
                const res = await fetch("/api/chat/message", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ message: "tra cứu TRS-20260506-50188" })
                });
                const data = await res.json();
                log({ status: res.status, response: data }, res.ok ? 'success' : 'error');
            } catch (e) {
                log({ error: e.message }, 'error');
            }

            log("\n=== Done ===", 'info');
        }

        runTests();
    </script>
</body>
</html>
